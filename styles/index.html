<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petite Ville · 4 styles</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a studio presenting four material tests side by side
   IDEA: a turntable in a workshop; the same little street corner, four materials
   PICTURE: the live 3D vignette fills the screen
   COLOUR and TYPE: dusk ink panels over each style's own backdrop; Baloo 2 + Nunito
   LAYOUT: scene full screen, style switcher and verdict card at the bottom */
:root{color-scheme:dark;--night:#1d2142;--honey:#ffb547;--paper:#fff8ee;--ink:#2a2233;--lav:#c9c6e6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#222;font:16px/1.45 Nunito,system-ui,sans-serif;color:#f3efff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.badge{pointer-events:auto;background:rgba(29,33,66,.85);backdrop-filter:blur(8px);border-radius:99px;padding:8px 16px;font:800 15px 'Baloo 2',sans-serif}
.badge span{color:var(--honey)}
.panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 20px));background:rgba(29,33,66,.92);backdrop-filter:blur(10px);border-radius:24px;padding:14px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{border:0;border-radius:14px;min-height:52px;background:rgba(255,255,255,.07);color:#f3efff;font:800 14px Nunito,sans-serif;cursor:pointer;padding:6px 4px;line-height:1.15}
.tabs button small{display:block;font:700 11px Nunito,sans-serif;color:var(--lav)}
.tabs button.on{background:var(--honey);color:var(--ink)}.tabs button.on small{color:#5a4a2a}
.tabs button:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.info{margin-top:12px;padding:0 4px}
.info h2{font:800 22px/1.1 'Baloo 2',sans-serif;margin:0 0 4px;color:var(--honey)}
.info p{margin:0;color:var(--lav);font-size:15px}
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;font-size:13px}
.pc div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.pc b{display:block;font-size:12px;color:#fff;margin-bottom:2px}
@media(max-width:520px){.tabs button{font-size:12px}.info p{font-size:14px}.pc{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c" aria-label="Aperçu 3D du style"></canvas>
<div class="top"><div class="badge">Petite Ville · <span>4 pistes de style</span></div><div class="badge" id="hint">Fais glisser pour tourner</div></div>
<div class="panel">
 <div class="tabs" role="tablist">
  <button type="button" data-s="clay" class="on">A · Pâte<small>à modeler</small></button>
  <button type="button" data-s="wood">B · Bois<small>jouet peint</small></button>
  <button type="button" data-s="paper">C · Papier<small>découpé</small></button>
  <button type="button" data-s="ink">D · Gouache<small>livre illustré</small></button>
 </div>
 <div class="info"><h2 id="tName"></h2><p id="tDesc"></p><div class="pc"><div><b>Pour</b><span id="tPro"></span></div><div><b>Contre</b><span id="tCon"></span></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const INFO = {
  clay: ['A · Pâte à modeler', 'Tout semble modelé à la main : formes douces et un peu bombées, petites traces de doigts, couleurs vives. Rappelle les films d’animation en volume plutôt que les jeux vidéo.', 'Très reconnaissable, chaleureux, attachant. Rare dans les applis de langue. Excellent sur Instagram.', 'Plus de détails à modéliser pour chaque objet. Un peu plus lourd sur les vieux téléphones.'],
  wood: ['B · Bois, jouet peint', 'Un village de jouets en bois peint : arêtes arrondies, veinage visible sous la peinture, personnages en quilles. Calme, haut de gamme, rassurant.', 'Élégant et original, très lisible, léger. Plaît aux adultes comme aux enfants.', 'Moins « vivant » que la pâte. Les personnages sont plus simples, moins expressifs.'],
  paper: ['C · Papier découpé', 'Une maquette en papier : couches découpées, bords blancs, grain du papier, ombres portées entre les couches. Comme un livre pop-up.', 'Très original, poétique, se démarque immédiatement. Très léger à afficher.', 'Vue de près à la première personne, les objets plats se voient. Demande des cadrages soignés.'],
  ink: ['D · Gouache, livre illustré', 'Un album illustré qui prend vie : aplats de couleur en 3 tons, contour à l’encre, texture de pinceau.', 'Lisible, expressif, très « dessiné ». Facile à étendre à beaucoup de lieux.', 'Le style « cel-shading » existe déjà dans beaucoup de jeux : moins unique que A ou C.']
};
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight);
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 200);
cam.position.set(7.5, 5.2, 9.5);
const ctl = new THREE.OrbitControls(cam, canvas); ctl.target.set(0, 1.4, 0); ctl.enableDamping = true; ctl.enablePan = false; ctl.minDistance = 6; ctl.maxDistance = 20; ctl.maxPolarAngle = 1.5; ctl.autoRotate = true; ctl.autoRotateSpeed = .7;
canvas.addEventListener('pointerdown', () => { ctl.autoRotate = false; document.getElementById('hint').textContent = 'Pince ou molette pour zoomer'; }, { once: true });
const rnd = (a, b) => a + Math.random() * (b - a), TAU = Math.PI * 2;
function tex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
function lin(w, h, draw, rep) { const t = tex(w, h, draw, rep); t.encoding = THREE.LinearEncoding; return t; }
/* boîte arrondie maison */
function rbox(w, h, d, r, seg) {
  seg = seg || 6; r = Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001);
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg), p = g.attributes.position, v = new THREE.Vector3(), inner = new THREE.Vector3();
  if (r <= 0) return g;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); inner.set(Math.max(-w / 2 + r, Math.min(w / 2 - r, v.x)), Math.max(-h / 2 + r, Math.min(h / 2 - r, v.y)), Math.max(-d / 2 + r, Math.min(d / 2 - r, v.z))); const dir = v.clone().sub(inner); if (dir.lengthSq() > 0) { dir.normalize().multiplyScalar(r); v.copy(inner).add(dir); } p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
function wobble(g, a) { const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), n = Math.sin(x * 3.1 + y * 1.7) * Math.cos(z * 2.3 + y * 2.9); p.setXYZ(i, x + n * a, y + n * a * .6, z + n * a); } g.computeVertexNormals(); return g; }
function roofGeo(w, rh, d, bevel) { const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, rh); s.lineTo(-w / 2, 0); const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 5, curveSegments: 8 }); g.translate(0, 0, -d / 2); g.computeVertexNormals(); return g; }

/* ---------- textures par style ---------- */
const clayBump = lin(256, 256, (g, w, h) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); for (let i = 0; i < 260; i++) { const x = Math.random() * w, y = Math.random() * h, r = rnd(4, 14); g.strokeStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},.18)`; g.lineWidth = rnd(1, 2.5); g.beginPath(); g.arc(x, y, r, rnd(0, TAU), rnd(0, TAU) + 2); g.stroke(); } for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},.06)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, [2, 2]);
const woodGrain = tex(256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 2) { const k = Math.sin(y * .09 + Math.sin(y * .021) * 4) * .5 + .5; g.fillStyle = `rgba(120,80,40,${.05 + k * .14})`; g.fillRect(0, y, w, 2); } for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(110,70,35,.25)'; g.lineWidth = 2; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, rnd(6, 14), rnd(3, 6), 0, 0, TAU); g.stroke(); } }, [1, 1]);
const paperT = tex(256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { g.strokeStyle = `rgba(0,0,0,${rnd(.02, .05)})`; g.lineWidth = 1; g.beginPath(); const x = Math.random() * w, y = Math.random() * h, a = rnd(0, TAU), l = rnd(3, 12); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }, [1, 1]);
const brushT = tex(256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(0,0,0,${rnd(.03, .08)})`; g.lineWidth = rnd(6, 16); g.lineCap = 'round'; g.beginPath(); const x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); g.quadraticCurveTo(x + rnd(-30, 30), y + rnd(-10, 10), x + rnd(20, 60), y + rnd(-14, 14)); g.stroke(); } }, [1, 1]);
const toonGrad = (() => { const d = new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

/* ---------- réglages des 4 styles ---------- */
const STY = {
  clay: { bg: ['#f6e1c8', '#e9c3a6'], round: .22, seg: 7, wob: .025, outline: false,
    mat: (c) => new THREE.MeshStandardMaterial({ color: c, roughness: .62, bumpMap: clayBump, bumpScale: .018 }),
    pal: { wallA: '#ff8f70', wallB: '#ffd36b', roofA: '#5fb0a8', roofB: '#e2595a', trim: '#fff4e2', win: '#3d4a7a', door: '#7a4a9a', ground: '#f0d7b5', grass: '#8ccf6e', leaf: '#5fbf6a', trunk: '#a8693e', lamp: '#4a5a8a', bench: '#d97a3e', skin: '#ffc9a8', shirt: '#4a8fe0', cat: '#ff9f43' } },
  wood: { bg: ['#e6ecef', '#c9d4da'], round: .07, seg: 4, wob: 0, outline: false,
    mat: (c, raw) => new THREE.MeshStandardMaterial({ color: c, roughness: raw ? .75 : .5, map: woodGrain }),
    pal: { wallA: '#e86f5a', wallB: '#f2c14e', roofA: '#c9a27a', roofB: '#c9a27a', trim: '#fbf6ec', win: '#2f4a6a', door: '#3f7a6a', ground: '#d9b88f', grass: '#b5c96a', leaf: '#6aa56a', trunk: '#c9a27a', lamp: '#2f4a6a', bench: '#c9a27a', skin: '#f2c9a0', shirt: '#3f7a6a', cat: '#2a2233' } },
  paper: { bg: ['#efe9df', '#dcd2c4'], round: 0, seg: 1, wob: 0, outline: 'edges',
    mat: (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 1, map: paperT }),
    pal: { wallA: '#f29b84', wallB: '#f6d58e', roofA: '#7aa6c2', roofB: '#c76b6b', trim: '#fffaf2', win: '#46557a', door: '#8a6aa8', ground: '#e8dccb', grass: '#a9cf8e', leaf: '#7cbf86', trunk: '#b08a68', lamp: '#46557a', bench: '#d99a6a', skin: '#f6d0b5', shirt: '#6a9ad0', cat: '#f2a65a' } },
  ink: { bg: ['#fbe9c8', '#f3c9a0'], round: .05, seg: 3, wob: .01, outline: 'hull',
    mat: (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: toonGrad, map: brushT }),
    pal: { wallA: '#ef7b5f', wallB: '#f7c75a', roofA: '#3f8f8a', roofB: '#c4473f', trim: '#fff3e0', win: '#2e3a6a', door: '#6a3f8a', ground: '#f1d3a6', grass: '#9fd36a', leaf: '#4fae5f', trunk: '#8a5a32', lamp: '#2e3a6a', bench: '#d9733a', skin: '#ffcfa6', shirt: '#3f7fd8', cat: '#f28f2e' } }
};

/* ---------- lumières communes ---------- */
const hemi = new THREE.HemisphereLight('#fff6e8', '#b89a80', .7); scene.add(hemi);
const key = new THREE.DirectionalLight('#fff1dc', 1.25); key.position.set(6, 10, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 }); key.shadow.bias = -.0005; key.shadow.normalBias = .02; key.shadow.radius = 4; scene.add(key);
const fill = new THREE.DirectionalLight('#dfe8ff', .35); fill.position.set(-6, 4, -4); scene.add(fill);

let root = null;
function build(style) {
  const S = STY[style], P = S.pal, g = new THREE.Group();
  const shell = []; /* objets qui recevront un contour */
  const mesh = (geo, c, x, y, z, parent, raw) => { if (S.wob) wobble(geo, S.wob); const m = new THREE.Mesh(geo, S.mat(c, raw)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; (parent || g).add(m); shell.push(m); return m; };
  const B = (w, h, d, c, x, y, z, p, raw) => mesh(rbox(w, h, d, S.round * Math.min(w, h, d) * 1.6, S.seg), c, x, y, z, p, raw);
  /* socle */
  if (style === 'paper') {
    [[5.6, '#cfc2ae', -.45], [5.3, P.grass, -.3], [4.6, P.ground, -.15]].forEach(([r, c, y]) => { const s = new THREE.Shape(); for (let i = 0; i <= 64; i++) { const a = i / 64 * TAU, rr = r + Math.sin(a * 9) * .12; s[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); } const geo = new THREE.ExtrudeGeometry(s, { depth: .14, bevelEnabled: false }); geo.rotateX(-Math.PI / 2); mesh(geo, c, 0, y, 0); });
  } else {
    mesh(style === 'wood' ? rbox(11.2, .5, 11.2, .2, 4) : new THREE.CylinderGeometry(5.6, 5.4, .5, 64), P.grass, 0, -.25, 0, null, true);
    mesh(new THREE.CylinderGeometry(4.6, 4.6, .12, 64), P.ground, 0, .06, 0);
  }
  /* maison A */
  const hA = new THREE.Group(); hA.position.set(-1.5, 0, -1.3); hA.rotation.y = .25; g.add(hA);
  B(2.6, 3.0, 2.2, P.wallA, 0, 1.5, 0, hA);
  mesh(roofGeo(3.0, 1.3, 2.5, S.round ? .08 : 0), P.roofA, 0, 3.0, 0, hA);
  B(.62, 1.05, .14, P.door, 0, .55, 1.12, hA);
  [[-.75, 2.2], [.75, 2.2], [-.75, 1.0], [.75, 1.0]].forEach(([x, y], i) => { if (i === 3 && false) return; B(.62, .7, .1, P.trim, x, y, 1.12, hA); B(.46, .54, .1, P.win, x, y, 1.16, hA); });
  B(.4, .9, .4, P.trim, .7, 3.5, -.4, hA);
  /* maison B */
  const hB = new THREE.Group(); hB.position.set(1.5, 0, -1.6); hB.rotation.y = -.3; g.add(hB);
  B(2.0, 2.4, 2.0, P.wallB, 0, 1.2, 0, hB);
  mesh(roofGeo(2.4, 1.6, 2.3, S.round ? .08 : 0), P.roofB, 0, 2.4, 0, hB);
  B(.56, .95, .14, P.door, -.45, .5, 1.02, hB);
  B(.58, .58, .1, P.trim, .45, 1.55, 1.02, hB); B(.42, .42, .1, P.win, .45, 1.55, 1.06, hB);
  B(1.3, .12, .5, P.trim, -.1, 1.15, 1.25, hB);
  /* arbre */
  const tr = new THREE.Group(); tr.position.set(2.6, 0, 1.2); g.add(tr);
  if (style === 'paper') {
    B(.16, 1.3, .16, P.trunk, 0, .65, 0, tr);
    [0, 1, 2].forEach(i => { const s = new THREE.Shape(); const r = 1 - i * .18; s.moveTo(0, 0); for (let k = 0; k <= 24; k++) { const a = Math.PI + k / 24 * Math.PI * 2; const rr = r * (1 + Math.sin(k * 1.3) * .08); s.lineTo(Math.cos(a) * rr * .95, Math.sin(a) * rr * 1.1 + 1.0); } const geo = new THREE.ExtrudeGeometry(s, { depth: .05, bevelEnabled: false }); const m = mesh(geo, new THREE.Color(P.leaf).offsetHSL(0, 0, -.06 + i * .06).getStyle(), 0, 1.0 + i * .1, -.15 + i * .12, tr); m.rotation.y = i * .25; });
  } else if (style === 'wood') {
    B(.22, 1.4, .22, P.trunk, 0, .7, 0, tr, true); mesh(new THREE.SphereGeometry(.85, 32, 24), P.leaf, 0, 1.9, 0, tr);
  } else {
    B(.24, 1.3, .24, P.trunk, 0, .65, 0, tr);
    [[0, 1.85, 0, .8], [.45, 1.55, .2, .55], [-.4, 1.6, -.15, .58], [.05, 2.35, .05, .5]].forEach(([x, y, z, r]) => mesh(new THREE.SphereGeometry(r, 28, 20), P.leaf, x, y, z, tr));
  }
  /* réverbère */
  const lp = new THREE.Group(); lp.position.set(-2.8, 0, 1.4); g.add(lp);
  B(.14, 2.6, .14, P.lamp, 0, 1.3, 0, lp); B(.4, .5, .4, '#fff1b8', 0, 2.75, 0, lp); B(.5, .12, .5, P.lamp, 0, 3.05, 0, lp);
  const glow = new THREE.PointLight('#ffd27a', .6, 5); glow.position.set(-2.8, 2.7, 1.4); g.add(glow);
  /* banc */
  const bn = new THREE.Group(); bn.position.set(-.6, 0, 1.9); bn.rotation.y = .15; g.add(bn);
  B(1.5, .12, .5, P.bench, 0, .48, 0, bn); B(1.5, .45, .1, P.bench, 0, .8, -.22, bn); [-.6, .6].forEach(x => B(.1, .45, .45, P.lamp, x, .24, 0, bn));
  /* personnage */
  const pr = new THREE.Group(); pr.position.set(.9, 0, 1.6); pr.rotation.y = -.5; g.add(pr);
  if (style === 'paper') {
    const s = new THREE.Shape(); s.moveTo(-.28, 0); s.lineTo(.28, 0); s.lineTo(.32, .9); s.quadraticCurveTo(.3, 1.05, .16, 1.08); s.absarc(0, 1.32, .26, -.6, Math.PI + .6, false); s.lineTo(-.16, 1.08); s.quadraticCurveTo(-.3, 1.05, -.32, .9); s.lineTo(-.28, 0);
    mesh(new THREE.ExtrudeGeometry(s, { depth: .05, bevelEnabled: false }), P.shirt, 0, 0, 0, pr);
    const face = new THREE.Mesh(new THREE.CircleGeometry(.24, 24), new THREE.MeshStandardMaterial({ color: P.skin, roughness: 1, map: paperT })); face.position.set(0, 1.32, .06); pr.add(face);
    [-.08, .08].forEach(x => { const e = new THREE.Mesh(new THREE.CircleGeometry(.03, 10), new THREE.MeshBasicMaterial({ color: '#2a2233' })); e.position.set(x, 1.36, .07); pr.add(e); });
  } else {
    if (style === 'wood') { mesh(new THREE.CylinderGeometry(.24, .3, .9, 24), P.shirt, 0, .45, 0, pr); }
    else { mesh(new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(.24, .5, 8, 16) : new THREE.CylinderGeometry(.24, .28, .9, 20), P.shirt, 0, .6, 0, pr); [-.11, .11].forEach(x => B(.12, .3, .14, '#3a3a5a', x, .12, 0, pr)); }
    mesh(new THREE.SphereGeometry(.3, 32, 24), P.skin, 0, 1.25, 0, pr);
    mesh(new THREE.SphereGeometry(.31, 32, 16, 0, TAU, 0, Math.PI / 2.2), style === 'wood' ? '#6a4a2a' : '#5a3a2a', 0, 1.3, -.02, pr);
    [-.1, .1].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.035, 12, 10), new THREE.MeshBasicMaterial({ color: '#2a2233' })); e.position.set(x, 1.27, .27); pr.add(e); });
    if (style !== 'wood') [-.17, .17].forEach(x => { const c = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 10), new THREE.MeshBasicMaterial({ color: '#ff9a9a' })); c.position.set(x, 1.18, .25); c.scale.z = .4; pr.add(c); });
  }
  /* chat */
  const ct = new THREE.Group(); ct.position.set(.2, 0, 2.6); ct.rotation.y = .9; g.add(ct);
  if (style === 'paper') { const s = new THREE.Shape(); s.moveTo(-.25, 0); s.lineTo(.2, 0); s.lineTo(.22, .25); s.lineTo(.3, .38); s.lineTo(.24, .42); s.lineTo(.16, .34); s.lineTo(.04, .34); s.lineTo(-.04, .42); s.lineTo(-.08, .3); s.lineTo(-.25, .22); s.lineTo(-.4, .3); s.lineTo(-.3, .15); s.lineTo(-.25, 0); mesh(new THREE.ExtrudeGeometry(s, { depth: .04, bevelEnabled: false }), P.cat, 0, 0, 0, ct); }
