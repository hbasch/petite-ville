<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petite Ville</title>
<meta name="description" content="Apprends l'anglais ou le polonais en parlant aux habitants d'une petite ville en 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Scène 3D"></canvas>

<!-- ===== Compte ===== -->
<div id="auth" class="overlay">
 <div class="ov panel">
  <div class="logo">Petite Ville</div>
  <p class="tag" data-i="tagline"></p>
  <div class="uiSwitch" role="group" aria-label="Langue">
   <button type="button" data-ui="fr">Français</button><button type="button" data-ui="pl">Polski</button>
  </div>
  <form id="authForm" novalidate>
   <h1 id="authTitle"></h1>
   <p class="why" id="authWhy" data-i="signupWhy"></p>
   <label class="f su"><span data-i="pseudo"></span><input id="aPseudo" autocomplete="nickname" maxlength="24"></label>
   <label class="f"><span data-i="email"></span><input id="aEmail" type="email" autocomplete="email"></label>
   <label class="f"><span data-i="password"></span><input id="aPass" type="password" autocomplete="current-password" minlength="6"></label>
   <div class="two su">
    <label class="f"><span data-i="speak"></span><select id="aUi"></select></label>
    <label class="f"><span data-i="learn"></span><select id="aT"></select></label>
   </div>
   <div class="msg hidden" id="authMsg"></div>
   <button class="btn pri wide" id="authBtn" type="submit"></button>
   <button class="link" id="authSwitch" type="button"></button>
   <div class="mini" id="localNote"></div>
  </form>
 </div>
</div>

<!-- ===== HUD ===== -->
<header id="me" class="hud tl panel hidden">
 <button type="button" id="meBtn" class="meBtn" aria-haspopup="true">
  <span class="av" id="av">?</span>
  <span class="meTxt"><b id="meName"></b><small id="meLvl"></small></span>
  <span class="streak" id="streak" title=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg><span id="stN">0</span></span>
 </button>
 <div class="xp"><i id="xpBar"></i></div>
 <div class="daily"><span data-i="daily"></span> <b id="dailyN">0/50 XP</b></div>
 <div id="menu" class="menu hidden">
  <div class="mh" data-i="menuLang"></div>
  <div class="two"><label class="f"><span data-i="speak"></span><select id="mUi"></select></label><label class="f"><span data-i="learn"></span><select id="mT"></select></label></div>
  <button class="btn" id="mSave" type="button" data-i="saveLang"></button>
  <a class="mi" href="rue/" data-i="menuStreet"></a>
  <button class="mi" id="mOut" type="button" data-i="logout"></button>
 </div>
</header>

<aside id="mission" class="hud panel hidden" aria-label="Mission">
 <h2><span data-i="mission"></span> <button id="minBtn" type="button" data-i="hide"></button></h2>
 <ol>
  <li data-t="talk" data-i="t_talk"></li>
  <li data-t="order" data-i="t_order"></li>
  <li data-t="pay" data-i="t_pay"></li>
  <li data-t="words" data-i="t_words"></li>
 </ol>
 <div class="prog"><span data-i="found"></span><b id="fc">0</b><div class="bar"><i id="fb"></i></div></div>
</aside>

<section id="card" class="panel bottom hidden" aria-live="polite">
 <button class="x" type="button" data-close="card" aria-label="×">×</button>
 <h3 class="word" id="wT"></h3>
 <div class="fr" id="wUi"></div>
 <p class="ex" id="wEx"></p><div class="fr" id="wExUi"></div>
 <div class="note hidden" id="wNote"></div>
 <div class="pron hidden" id="wPron"></div>
 <div class="row">
  <button class="btn pri" id="wListen" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span data-i="listen"></span></button>
  <button class="btn mic" id="wRepeat" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span data-i="repeat"></span></button>
  <button class="btn" id="wSave" type="button"></button>
 </div>
</section>

<section id="dlg" class="panel bottom hidden" aria-live="polite">
 <button class="x" type="button" data-close="dlg" aria-label="×">×</button>
 <div class="who"><span id="dWho"></span>
  <button class="btn sm" id="dReplay" type="button" data-i="replay"></button>
  <button class="btn sm" id="dTr" type="button" data-i="translate"></button>
 </div>
 <div class="me2" id="dMe"></div>
 <p class="line" id="dLine"></p><div class="fr" id="dTrTxt"></div>
 <div class="tip hidden" id="dTip"></div>
 <div class="talk">
  <button class="micBig" id="dMic" type="button" aria-label="Parler"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg></button>
  <div class="heard" id="dHeard"></div>
 </div>
 <div class="opts" id="dOpts"></div>
 <div class="mini" data-i="voiceNote"></div>
</section>

<button id="deckBtn" class="hud hidden" type="button"><span data-i="cards"></span> <b id="deckN">0</b></button>
<aside id="deck" class="panel hidden" aria-label="Cartes">
 <button class="x" type="button" data-close="deck" aria-label="×">×</button>
 <h2 data-i="cards"></h2>
 <div class="fr" data-i="cardsSub"></div>
 <div class="row"><button class="btn pri" id="revBtn" type="button" data-i="review"></button></div>
 <div id="flash" class="flash hidden">
  <div class="fr" data-i="howSay"></div>
  <div class="q" id="fQ"></div>
  <div class="a hidden" id="fA"></div>
  <div class="row center">
   <button class="btn pri" id="fShow" type="button" data-i="reveal"></button>
   <button class="btn hidden" id="fAgain" type="button" data-i="again"></button>
   <button class="btn pri hidden" id="fKnew" type="button" data-i="knew"></button>
  </div>
 </div>
 <ul class="cards" id="cards"></ul>
 <div class="empty" id="emptyDeck" data-i="noCards"></div>
</aside>

<div id="hover" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<div id="intro" class="overlay hidden">
 <div class="ov panel">
  <h1><span data-i="introTitle"></span> <em id="shopName"></em></h1>
  <p id="introText"></p>
  <ul class="steps">
   <li><i>1</i><span data-i="step1"></span></li>
   <li><i>2</i><span data-i="step2"></span></li>
   <li><i>3</i><span id="step3"></span></li>
  </ul>
  <button class="btn pri wide" id="enter" type="button" data-i="enter"></button>
 </div>
</div>

<div id="win" class="overlay hidden">
 <div class="ov panel">
  <h1><span data-i="winTitle"></span></h1>
  <p id="winText"></p>
  <div class="stats">
   <div><b id="sW">0</b><span data-i="wWords"></span></div>
   <div><b id="sS">0</b><span data-i="wSpoken"></span></div>
   <div><b id="sE">0</b><span data-i="wErr"></span></div>
  </div>
  <div class="lock">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
   <div><b data-i="nextScene"></b><small data-i="plus"></small></div>
  </div>
  <div class="row">
   <button class="btn pri" id="again" type="button" data-i="againBtn"></button>
   <button class="btn" id="explore" type="button" data-i="explore"></button>
  </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
